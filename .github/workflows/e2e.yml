name: E2E Tests

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  # E2E: Debian Bookworm + python3-pip — which(pip) fallback bootstraps uv
  debian-bookworm-pip:
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm

    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: apt-get update && apt-get install -y python3 python3-pip

      - name: Bootstrap appenv
        run: |
          mkdir /tmp/testproject && cd /tmp/testproject

          cp $GITHUB_WORKSPACE/src/appenv.py appenv
          chmod +x appenv

          cat > pyproject.toml << 'EOF'
          [project]
          name = "bootstrap-test"
          version = "0.1.0"
          dependencies = ["httpie"]
          requires-python = ">=3.10"
          EOF

          ./appenv update-lockfile
          ln -s appenv http

      - name: Run http
        run: cd /tmp/testproject && ./http --version

  # E2E: uvx from git — user has only uv, runs uvx appenv init
  ubuntu-uvx:
    runs-on: ubuntu-24.04

    steps:
      - uses: astral-sh/setup-uv@v7

      - name: uvx appenv init from current branch
        run: |
          mkdir /tmp/testproject && cd /tmp/testproject
          printf 'http\nhttpie\n\n\n\n3.12\n' | uvx --from git+https://github.com/flyingcircusio/appenv@${{ github.head_ref || github.ref_name }} appenv init

      - name: Run http
        run: cd /tmp/testproject && ./http --version
