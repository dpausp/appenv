name: Bootstrap

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  # E2E: Fresh Debian Bookworm + python3-pip — appenv bootstraps uv via which(pip)
  debian-bookworm-pip:
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm

    steps:
      - uses: actions/checkout@v4

      - name: Install minimal prerequisites
        run: |
          apt-get update
          apt-get install -y python3 python3-pip

      - name: Bootstrap appenv project
        run: |
          cp src/appenv.py appenv
          chmod +x appenv

          # Create a minimal project
          echo '[project]
          name = "bootstrap-test"
          version = "0.1.0"
          dependencies = ["httpie"]
          requires-python = ">=3.9"' > pyproject.toml

          # Generate lockfile — this triggers uv discovery and installation
          ./appenv update-lockfile

      - name: Run binary from bootstrapped project
        run: |
          # http is exposed by httpie package — should work after bootstrap
          ./appenv run http --version || true
          # prepare also exercises the full chain
          ./appenv prepare

  # E2E: Bare Debian Bookworm — only python3, no pip, no uv
  # Expected to FAIL until uv installer fallback is implemented
  debian-bookworm-minimal:
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm

    steps:
      - uses: actions/checkout@v4

      - name: Install minimal prerequisites
        run: |
          apt-get update
          apt-get install -y python3

      - name: Bootstrap appenv project (expected to fail)
        run: |
          cp src/appenv.py appenv
          chmod +x appenv

          echo '[project]
          name = "bootstrap-test"
          version = "0.1.0"
          dependencies = ["httpie"]
          requires-python = ">=3.9"' > pyproject.toml

          # This should fail: no uv, no nix, no pip, no ensurepip
          ./appenv update-lockfile
        continue-on-error: true

  # E2E: Ubuntu with uv pre-installed — the happy path via uvx
  ubuntu-uvx:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Bootstrap via uvx
        run: |
          mkdir /tmp/testproject && cd /tmp/testproject

          # Simulate: user has uv, runs uvx appenv init
          uv --version
          uvx --from appenv appenv init || true

      - name: Bootstrap from source (simulates committed appenv)
        run: |
          mkdir -p /tmp/appenvproject && cd /tmp/appenvproject

          cp $GITHUB_WORKSPACE/src/appenv.py appenv
          chmod +x appenv

          echo '[project]
          name = "bootstrap-test"
          version = "0.1.0"
          dependencies = ["rich"]
          requires-python = ">=3.10"' > pyproject.toml

          # uv is in PATH — should be found immediately (step 1 of discovery)
          ./appenv update-lockfile
          ./appenv prepare
