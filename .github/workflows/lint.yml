name: Lint

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv tool install tox --with tox-uv-bare

      - run: tox -e fix
