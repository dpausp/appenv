[project]
name = "appenv"
dynamic = ["version"]
description = "Self-contained bootstrapping/updating of Python applications deployed through shared repositories."
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    {name = "Christian Theune", email = "ct@flyingcircus.io"},
]
keywords = ["deployment"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/flyingcircusio/appenv/"

[project.scripts]
appenv = "appenv:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build]
sources = ["src"]

[tool.hatch.version]
path = "src/appenv.py"

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "pexpect",
    "pytest-patterns",
    "pytest-deduplicate",
    "pytest-timeout",
    "pytest-ty>=0.1.5",
    "pytest-ruff>=0.5",
    "pytest-xdist>=3.8.0",
    "mutmut>=3.5.0",
]
lint = ["ruff", "ty", "vulture"]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    "tox",
    "tox-uv-bare",
]

[tool.tox]
env_list = ["fix", "cov", "3.10", "3.11", "3.12", "3.13", "3.14"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
package = "wheel"
runner = "uv-venv-lock-runner"
setenv = {APPENV_BEST_PYTHON = "{envpython}"}
dependency_groups = ["test"]
commands = [["pytest"]]

[tool.tox.env.fix]
skip_install = true
depends = []
description = "Format, lint, fix whitespace, type-check, dead code"
dependency_groups = ["test", "lint"]
commands = [
    ["ruff", "check", "--fix", "."],
    ["ruff", "format", "."],
    ["python", "scripts/fix_whitespace.py", "."],
    ["ty", "check", ".", "--exclude", ".vulture_exclude"],
    ["vulture", "src/", "tests/", ".vulture_exclude", "--min-confidence=80"],
]

[tool.tox.env.cov]
base_python = ["3.14"]
package = "wheel"
runner = "uv-venv-lock-runner"
setenv = {APPENV_BEST_PYTHON = "{envpython}"}
dependency_groups = ["test"]
description = "Tests with coverage and test deduplication check"
commands = [
    ["pytest", "--cov=appenv", "--cov-report=term-missing", "--cov-report=html"],
    ["python", "-m", "pytest_deduplicate", "tests/", "--ignore=tests/integration"],
]

[tool.ty.environment]
python-version = "3.14"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.pytest.ini_options]
addopts = [
    "--timeout=25",
    "-W", "error",
    "--tb=native",
    "-v",
    "-m", "not slow",
]
testpaths = ["tests"]
markers = [
    "slow: tests that install packages and take longer (run with: pytest -m slow)",
]

[tool.mutmut]
paths_to_mutate = ["src/"]
also_copy = ["README.md", "pyproject.toml", "uv.lock"]
# WARNING: mutmut segfaults on macOS due to setproctitle+fork bug
# (github.com/boxed/mutmut/issues/446, PR #450 pending)
# Run mutation testing on Linux CI only.
# Only run isolated unit tests (no subprocess/execv tests)
pytest_add_cli_args_test_selection = [
    "-k",
    "parse_uv_version or print_colored_diff or verbose_print or parse_requires_python or extract_package_name or parse_editable_spec or find_available_pythons or test_reset",
]
