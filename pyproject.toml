[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.26" ]

[project]
name = "appenv"
description = "Self-contained bootstrapping/updating of Python applications deployed through shared repositories."
readme = "README.md"
keywords = [ "deployment" ]
license = "BSD-3-Clause"
license-files = [ "LICENSE" ]
authors = [ { name = "Christian Theune", email = "ct@flyingcircus.io" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = []
urls.Homepage = "https://github.com/flyingcircusio/appenv/"
urls.Issues = "https://github.com/flyingcircusio/appenv/issues"
urls.Repository = "https://github.com/flyingcircusio/appenv.git"
scripts.appenv = "appenv:main"

[dependency-groups]
dev = [
  "tox",
  "tox-uv-bare",
  { include-group = "docs" },
  { include-group = "lint" },
  { include-group = "test" },
]
test = [
  "pexpect",
  "pytest",
  "pytest-cov",
  "pytest-deduplicate",
  "pytest-instafail>=0.5.0",
  "pytest-patterns",
  "pytest-ruff",
  "pytest-timeout",
  "pytest-ty",
  "pytest-xdist",
]
docs = [
  "furo",
  "myst-parser",
  "sphinx",
  "sphinx-autoapi",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
]
lint = [
  "pyproject-fmt",
  "ruff",
  "ty",
  "vulture",
]

[tool.hatch]
build.sources = [ "src" ]
build.targets.wheel.packages = [ "src" ]
version.path = "src/appenv.py"

[tool.uv]
sources.pytest-deduplicate = { git = "https://github.com/dpausp/pytest_deduplicate", branch = "ts-ai" }
sources.pytest-patterns = { git = "https://github.com/dpausp/pytest-patterns", branch = "ts-ai" }

[tool.ruff]
target-version = "py310"
lint.select = [ "B", "C4", "E", "F", "FLY", "I", "N", "PERF", "RUF", "SIM", "UP", "W" ]

[tool.pytest]
ini_options.addopts = [
  "--cov=src",
  "--cov-report=html",
  "--junitxml=report.xml",
  "--instafail",
  "--import-mode=importlib",
  "--timeout=120",
  "-W",
  "error",
  "--ruff",
  "--ty",
  "-m",
  "not slow",
]
ini_options.junit_family = "xunit2"
ini_options.markers = [
  "slow: tests that install packages and take longer (run with: pytest -m slow)",
]
ini_options.testpaths = [ "tests" ]

[tool.coverage]
run.branch = true
run.source = [ "batou" ]
report.precision = 2

[tool.tox]
env_list = [ "fix", "cov", "3.10", "3.11", "3.12", "3.13", "3.14" ]
skip_missing_interpreters = true
env.cov.base_python = [ "3.14" ]
env.cov.package = "wheel"
env.cov.runner = "uv-venv-lock-runner"
env.cov.setenv = { APPENV_BEST_PYTHON = "{envpython}" }
env.cov.dependency_groups = [ "test" ]
env.cov.depends = [ "fix" ]
env.cov.description = "Tests with coverage and test deduplication check"
env.cov.commands = [
  [ "pytest", "--cov=appenv", "--cov-report=term-missing", "--cov-report=html" ],
  # [ "python", "-m", "pytest_deduplicate", "tests/", "--ignore=tests/integration" ],
]
env.fix.skip_install = true
env.fix.depends = []
env.fix.description = "Format, lint, fix whitespace, type-check, dead code"
env.fix.dependency_groups = [ "test", "lint" ]
env.fix.commands = [
  [ "ruff", "check", "--fix" ],
  [ "vulture", "src/", "tests/", ".vulture_exclude", "--min-confidence=80" ],
  [ "python", "scripts/fix_whitespace.py", "." ],
  [ "ruff", "format" ],
]
env_run_base.package = "wheel"
env_run_base.runner = "uv-venv-lock-runner"
env_run_base.setenv = { APPENV_BEST_PYTHON = "{envpython}" }
env_run_base.dependency_groups = [ "test" ]
env_run_base.depends = [ "fix" ]
env_run_base.commands = [ [ "pytest", { replace = "posargs", extend = true } ] ]

[tool.scriv]
format = "md"
fragment_directory = "CHANGES.d"
output_file = "CHANGES.md"
version = "unreleased"
entry_title_template = ""
new_fragment_template = "- New changelog entry."
insert_marker = "- Nothing changed yet."
categories = ""
